# untangle-ai configuration example
# Copy this to ./untangle.yaml and customize

server:
  port: 3000
  host: localhost

providers:
  openai:
    enabled: true
    # API key can be set here or via OPENAI_API_KEY env var
    # apiKey: sk-...
    # apiKeySecretRef: env:OPENAI_API_KEY

    # Optionally customize which models are enabled
    # models:
    #   - id: gpt-4o
    #     enabled: true
    #   - id: gpt-4o-mini
    #     enabled: true
    #   - id: gpt-3.5-turbo
    #     enabled: false

# Optional deployment-group routing and fallback policy
# routing:
#   regionRouting:
#     enabled: true
#     homeRegion: us-east-1
#     defaultClientRegion: us-east-1
#     failoverRegions: [us-west-2, eu-west-1]
#     allowCrossRegionFallback: true
#     failureEjection:
#       enabled: true
#       failureThreshold: 5
#       cooldownMs: 30000
#   groups:
#     - alias: gpt-prod
#       strategy: priority # priority | weighted | shuffle | least-latency
#       cooldownMs: 5000
#       retryPolicy:
#         maxAttempts: 3
#         retryableStatusCodes: [408, 409, 429, 500, 502, 503, 504]
#       circuitBreaker:
#         failureThreshold: 3
#         resetTimeoutMs: 30000
#       streamFallbackPolicy:
#         mode: continue-disabled # continue-disabled | continue-with-policy-prompt
#         policyPrompt: "Continue from the interruption point without repeating prior text."
#       deployments:
#         - provider: openai
#           model: gpt-4o
#           region: us-east-1
#           lane: stable # stable | canary | shadow
#           priority: 0
#         - provider: openrouter
#           model: openai/gpt-4o
#           region: us-west-2
#           lane: canary
#           priority: 1
#       rollout:
#         mode: ab # disabled | canary | ab
#         canaryPercent: 20
#         includeStableFallback: true
#         shadow:
#           enabled: true
#           samplePercent: 10
#           maxDeployments: 1

# Optional control-plane foundation (Phase 1 Workstream C)
# controlPlane:
#   enabled: true
#   virtualKeyHeader: x-untangle-key
#   postgres:
#     enabled: true
#     connectionString: postgresql://postgres:postgres@localhost:5432/untangle
#     schema: public
#   redis:
#     enabled: true
#     connectionString: redis://localhost:6379
#     keyPrefix: untangle

# Optional richer observability controls (Phase 1 Workstream D)
# observability:
#   logging:
#     level: info # debug | info | warn | error
#   tracing:
#     enabled: true
#     sampleRate: 1.0 # 0.0 - 1.0
#     logSpans: true
#   metrics:
#     providerLabels: true

# Optional request compatibility controls (Phase 1 Workstream A)
# api:
#   compatibility:
#     strictValidation: false
#     normalizeLegacyParams: true

# Optional exact response cache (Phase 3)
# cache:
#   exact:
#     enabled: true
#     ttlMs: 30000
#     maxEntries: 1000
#     chat: true
#     responses: true

# Optional traffic shaping (Phase 3)
# trafficShaping:
#   enabled: true
#   requestsPerSecond: 100
#   burst: 200
#   adaptive:
#     enabled: true
#     minRps: 10
#     maxRps: 300
#     targetLatencyMs: 750
#     errorRateThreshold: 0.05
#     decreaseFactor: 0.8
#     increaseStep: 2
#     adjustIntervalMs: 2000

# Optional secret-reference resolution (Phase 3)
# secrets:
#   enabled: true
#   allowFileRefs: false # set true to allow provider apiKeySecretRef: file:...
#   baseDir: .

# Optional admin-plane security hardening (Phase 3)
# security:
#   requireAdminAuthForApi: true
#   adminApiKeySecretRef: env:UNTANGLE_ADMIN_API_KEY
#   adminHeader: x-untangle-admin-key
#   allowBearerToken: true
#   requireDataPlaneAuth: true
#   dataPlaneHeader: x-untangle-key
#   corsAllowedOrigins: []
#   corsAllowCredentials: false
#   maxBodyBytes: 1048576
#   maxMultipartBytes: 10485760
#   requireContentLength: true
#   protectMetrics: true
#   hsts:
#     enabled: false
#     maxAgeSeconds: 15552000
#     includeSubDomains: true
#     preload: false
