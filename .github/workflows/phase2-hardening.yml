name: phase2-hardening

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  phase2-suite:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Phase 2 validation gate
        run: pnpm run validate:phase2

  soak-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run long soak memory gate
        env:
          UNTANGLE_SOAK_ITERATIONS: "5000"
          UNTANGLE_SOAK_SAMPLE_EVERY: "100"
          UNTANGLE_SOAK_MAX_HEAP_GROWTH_MB: "120"
          UNTANGLE_SOAK_MAX_P95_MS: "500"
          UNTANGLE_SOAK_MAX_ERROR_RATE: "0.01"
          UNTANGLE_SOAK_MIN_FALLBACK_RATE: "0.1"
          UNTANGLE_SOAK_MAX_FALLBACK_RATE: "0.5"
        run: pnpm --filter @untangle-ai/server test:soak
