server:
  host: 127.0.0.1
  port: 4010

providers:
  openai:
    enabled: true
    apiKeySecretRef: env:OPENAI_API_KEY
    baseUrl: http://127.0.0.1:4020/v1
    models:
      - id: gpt-4o-mini-fail
        enabled: true
      - id: gpt-4o-mini-retry
        enabled: true
      - id: gpt-4o-mini-circuit
        enabled: true
      - id: whisper-1
        enabled: true
      - id: gpt-4o-mini-tts
        enabled: true
      - id: gpt-image-1
        enabled: true
  anthropic:
    enabled: true
    apiKeySecretRef: env:ANTHROPIC_API_KEY
  google:
    enabled: true
    apiKeySecretRef: env:GOOGLE_API_KEY
  groq:
    enabled: true
    apiKeySecretRef: env:GROQ_API_KEY
  openrouter:
    enabled: true
    apiKeySecretRef: env:OPENROUTER_API_KEY

routing:
  regionRouting:
    enabled: true
    homeRegion: us-east-1
    defaultClientRegion: us-east-1
    failoverRegions: [us-west-2]
    allowCrossRegionFallback: true
    failureEjection:
      enabled: true
      failureThreshold: 2
      cooldownMs: 10000
  groups:
    - alias: gpt-priority
      strategy: priority
      cooldownMs: 2000
      retryPolicy:
        maxAttempts: 2
        retryableStatusCodes: [408, 409, 429, 500, 502, 503, 504]
      circuitBreaker:
        failureThreshold: 2
        resetTimeoutMs: 5000
      deployments:
        - provider: openai
          model: gpt-4o-mini-fail
          priority: 0
          region: us-east-1
          lane: stable
        - provider: openai
          model: gpt-4o-mini
          priority: 1
          region: us-west-2
          lane: canary
        - provider: openai
          model: gpt-4o-mini
          priority: 2
          region: us-east-1
          lane: shadow
      rollout:
        mode: canary
        canaryPercent: 25
        includeStableFallback: true
        shadow:
          enabled: true
          samplePercent: 50
          maxDeployments: 1
    - alias: gpt-weighted
      strategy: weighted
      deployments:
        - provider: openai
          model: gpt-4o-mini
          weight: 80
          region: us-east-1
          lane: stable
        - provider: openai
          model: gpt-4o
          weight: 20
          region: us-east-1
          lane: stable
    - alias: gpt-shuffle
      strategy: shuffle
      deployments:
        - provider: openai
          model: gpt-4o-mini
          region: us-east-1
          lane: stable
        - provider: openai
          model: gpt-4o
          region: us-east-1
          lane: stable
    - alias: gpt-latency
      strategy: least-latency
      deployments:
        - provider: openai
          model: gpt-4o-mini
          region: us-east-1
          lane: stable
        - provider: openai
          model: gpt-4o
          region: us-east-1
          lane: stable
    - alias: gpt-retry
      strategy: priority
      cooldownMs: 5000
      deployments:
        - provider: openai
          model: gpt-4o-mini-retry
          priority: 0
          region: us-east-1
          lane: stable
        - provider: openai
          model: gpt-4o-mini
          priority: 1
          region: us-west-2
          lane: stable
    - alias: gpt-circuit
      strategy: priority
      circuitBreaker:
        failureThreshold: 2
        resetTimeoutMs: 5000
      deployments:
        - provider: openai
          model: gpt-4o-mini-circuit
          priority: 0
          region: us-east-1
          lane: stable
        - provider: openai
          model: gpt-4o-mini
          priority: 1
          region: us-west-2
          lane: stable

controlPlane:
  enabled: true
  virtualKeyHeader: x-untangle-key
  postgres:
    enabled: false
  redis:
    enabled: false

api:
  compatibility:
    strictValidation: true
    normalizeLegacyParams: true

cache:
  exact:
    enabled: true
    ttlMs: 60000
    maxEntries: 1000
    chat: true
    responses: true

trafficShaping:
  enabled: true
  requestsPerSecond: 2
  burst: 2
  adaptive:
    enabled: true
    minRps: 1
    maxRps: 5
    targetLatencyMs: 50
    errorRateThreshold: 0.1
    decreaseFactor: 0.5
    increaseStep: 1
  adjustIntervalMs: 1000

observability:
  logging:
    level: debug
  tracing:
    enabled: false
    sampleRate: 0
    logSpans: false

secrets:
  enabled: true
  allowFileRefs: false
  baseDir: D:\\untangle-ai

security:
  requireAdminAuthForApi: true
  adminApiKeySecretRef: env:UNTANGLE_ADMIN_API_KEY
  adminHeader: x-untangle-admin-key
  allowBearerToken: true
  requireDataPlaneAuth: true
  dataPlaneHeader: x-untangle-key
  corsAllowedOrigins: []
  corsAllowCredentials: false
  maxBodyBytes: 1048576
  maxMultipartBytes: 10485760
  requireContentLength: true
  protectMetrics: true
  hsts:
    enabled: false
    maxAgeSeconds: 15552000
    includeSubDomains: true
    preload: false
